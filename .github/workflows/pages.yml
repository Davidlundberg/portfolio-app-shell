name: Sync main to gh-pages

# GitHub Pages for this repo serves from the gh-pages branch (auto-enabled by
# its first push). GITHUB_TOKEN cannot create/configure the Pages site
# (admin-only), but it CAN push branches — so main is the canonical publish
# target and this workflow mirrors it to gh-pages on every push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main to gh-pages
        run: git push origin HEAD:gh-pages --force
